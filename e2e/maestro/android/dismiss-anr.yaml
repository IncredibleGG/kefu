# Android 模擬器:系統程式(常見是剛開機的 Pixel Launcher)ANR 時,「… isn't responding」框會蓋住 App,
# Maestro 看不到底下的設定頁。等到「設定頁或這個框」出現;是框就按「Close app」(該程式會自行重啟)再等。
# CI 另在跑 Maestro 前設 `hide_error_dialogs`,這裡處理設定生效前就已跳出的框。
# 若跳框的是 kefu 自己,關掉後設定頁不會出現,流程照樣失敗(真問題不會被吞掉)。
appId: cc.kf56k.kefu
---
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "測試連線|Close app"
          timeout: 90000
      - runFlow:
          when:
            visible:
              id: "android:id/aerr_close"
          commands:
            - tapOn:
                id: "android:id/aerr_close"
            - waitForAnimationToEnd
