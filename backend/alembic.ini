# Alembic 設定檔(乾淨室)。
#
# 重點:
# - script_location 指向與本檔同層的 alembic/ 目錄(容器內為 /app/alembic)。
# - prepend_sys_path = . 讓執行目錄(backend/ 或容器內 /app)進入 sys.path,
#   env.py 才能 `import app`。
# - sqlalchemy.url 只是佔位值;真正的 URL 一律由 env.py 從
#   app.core.config.settings.database_url 覆寫(單一事實來源)。

[alembic]
# 遷移腳本所在目錄(相對於本檔/執行目錄)。
script_location = alembic

# 讓 `app` 套件可被匯入。
prepend_sys_path = .

# 新版遷移檔名格式:<年月日序>_<slug>,方便依時間排序。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 產生遷移時使用 UTC 時間戳。
timezone = UTC

# 佔位 URL:實際連線字串由 env.py 用 settings.database_url 覆寫。
# 保留此行是為了讓 alembic.ini 自成完整設定;請勿在此填正式憑證。
sqlalchemy.url = postgresql+asyncpg://kefu:kefu@localhost:5432/kefu


# --- logging(alembic CLI 輸出)---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
