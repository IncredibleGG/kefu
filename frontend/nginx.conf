server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API 反向代理到後端(同源,免跨域)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket 反向代理
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Widget 交付檔:經同一公網域名 serve widget 容器的 embed.js。
  # CF 隧道僅指向本前端容器,widget 容器(dist/embed.js 於其 nginx 根)不對外;
  # 故在此精確反代 /embed.js 到 widget 服務,讓 <script src="…/embed.js"> 一行嵌入碼可用。
  # (必須置於 SPA fallback 之前,否則會被 try_files 落到管理台 index.html。)
  location = /embed.js {
    proxy_pass http://widget/embed.js;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 後端健康檢查:讓外部監控可經公網域名探後端(backend 不經隧道對外)。
  location = /health {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
