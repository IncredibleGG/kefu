# Android(Capacitor 8):debug APK(未上架、可直接安裝)+ 模擬器冒煙測試。
# 選填 secrets:
#   GOOGLE_SERVICES_JSON_B64     google-services.json 的 base64(沒有時推播不會運作,但建置照樣成功)
#   ANDROID_DEBUG_KEYSTORE_B64       共用簽章 keystore(PKCS12、alias kefu)的 base64
#   ANDROID_DEBUG_KEYSTORE_PASSWORD  它的密碼
#   兩者讓每次建置簽章相同,新版才能覆蓋安裝;憑證指紋固定在下方 ANDROID_CERT_SHA256。
#   tag 與 main 的建置沒有 keystore 會直接失敗(不可發佈隨機簽章的 APK);PR(含 fork)只警告。
name: android

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/src-tauri/**'
      - '!frontend/ios/**'
      - 'clients/**'
      - '.github/workflows/android.yml'
      - 'e2e/maestro/**'
      - 'e2e/scripts/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '!frontend/src-tauri/**'
      - '!frontend/ios/**'
      - 'clients/**'
      - '.github/workflows/android.yml'
      - 'e2e/maestro/**'
      - 'e2e/scripts/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      GOOGLE_SERVICES_JSON_B64:
        required: false
      ANDROID_DEBUG_KEYSTORE_B64:
        required: false
      ANDROID_DEBUG_KEYSTORE_PASSWORD:
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm 下載偶發網路中斷(ECONNRESET)時自動重試,避免 CI 被 registry 抖動卡住
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

jobs:
  apk:
    name: build (debug apk)
    runs-on: ubuntu-latest           # 已裝 Android SDK(platform 36、build-tools 35/36/37)
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      # 共用簽章憑證的 SHA-256(公開資訊);有 keystore secret 時,建出來的 APK 必須是這張憑證
      ANDROID_CERT_SHA256: 54f4556af45dbe879d79b00d1794b34ed8cc4468838ce7432eef78e09d9dfdd5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 建置號取 git commit 數,需要完整歷史

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'           # ubuntu 預設 17,Capacitor 8 需要 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: npm ci

      - name: 注入品牌與版本
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # 建置號 = commit 數:同一 commit 在各 workflow 一致且單調遞增,
          # 避免 run_number 各自計數造成 Android versionCode 倒退而無法覆蓋安裝
          args=(--build "$(git rev-list --count HEAD)")
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            v="${v%%[-+]*}"
            args+=(--version "$v")
          fi
          node clients/scripts/sync-brand.mjs "${args[@]}"

      - name: native 建置
        # 有 google-services.json 才開啟 Android 推播註冊(沒有 Firebase 設定時呼叫 register 會原生閃退);
        # 已存在的環境變數優先於 .env.native
        env:
          VITE_FCM_ENABLED: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' && 'on' || 'off' }}
        run: npm run build:native

      - run: npx cap sync android

      - name: google-services.json(選填,推播用)
        if: env.GOOGLE_SERVICES_JSON_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "已寫入 android/app/google-services.json"

      # 共用簽章:同一把 key 新版才能直接覆蓋安裝。由 app/build.gradle 讀 KEFU_ANDROID_KEYSTORE;
      # 不能只放 ~/.android/debug.keystore(AGP 在 CI 不讀那裡,v0.1.0 因此是每次隨機產生的簽章)
      # keystore 是之後每一版的長期簽章身分:secret 只給這一步(npm ci / vite / cap sync 等第三方程式碼讀不到),
      # 之後的步驟只看得到檔案路徑 KEFU_ANDROID_KEYSTORE
      - name: 共用簽章 keystore
        shell: bash
        env:
          DEBUG_KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          DEBUG_KS_PW: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KS_B64" ]; then
            echo "沒有 ANDROID_DEBUG_KEYSTORE_B64,改用 AGP 預設 debug keystore(由「檢查簽章」決定是否放行)"
            exit 0
          fi
          if [ -z "$DEBUG_KS_PW" ]; then
            echo "::error title=簽章::有 ANDROID_DEBUG_KEYSTORE_B64 卻沒有 ANDROID_DEBUG_KEYSTORE_PASSWORD"
            exit 1
          fi
          ks="$RUNNER_TEMP/kefu-android.p12"
          printf '%s' "$DEBUG_KS_B64" | base64 -d > "$ks"
          echo "KEFU_ANDROID_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: assembleDebug
        working-directory: frontend/android
        env:
          KEFU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew           # 從 Windows commit 或 zip 搬過來會掉執行權限
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 檢查簽章
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEFU_ANDROID_KEYSTORE:-}" ]; then
            # 沒有 keystore 時 APK 是 AGP 隨機產生的簽章:可發佈的建置一律擋下,PR(含 fork)只警告
            if [ "$GITHUB_REF_TYPE" = tag ] || [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::error title=簽章::缺少 ANDROID_DEBUG_KEYSTORE_B64,APK 會是隨機簽章,不可發佈"
              exit 1
            fi
            echo "::warning title=簽章::沒有共用 keystore,這次的 APK 是隨機簽章(無法覆蓋安裝其他版本)"
            exit 0
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-certs.txt"
          # 各版 apksigner 的前綴不同(「Signer #1 …」「V2 Signer: …」「Signer (minSdkVersion=…) …」),
          # 只取「digest: 」之後的值;每個 signer 都必須是共用憑證
          mapfile -t digests < <(sed -n 's/.*certificate SHA-256 digest: *\([0-9A-Fa-f]*\).*/\1/p' "$RUNNER_TEMP/apk-certs.txt")
          echo "APK 簽章憑證 SHA-256:${digests[*]:-(讀不到)}"
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "::error title=簽章::apksigner 的輸出裡讀不到憑證 SHA-256"
            exit 1
          fi
          for d in "${digests[@]}"; do
            if [ "${d,,}" != "$ANDROID_CERT_SHA256" ]; then
              echo "::error title=簽章::APK 不是用共用 keystore 簽的(讀到 $d,預期 $ANDROID_CERT_SHA256),新版將無法覆蓋安裝"
              exit 1
            fi
          done

      - name: 整理產物
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/kefu-android-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          path: kefu-android-debug.apk
          archive: false               # 單一檔案不壓縮,artifact 名稱就是檔名
          if-no-files-found: error
          retention-days: 14

  # ---------- 冒煙測試:模擬器安裝、啟動、截圖(暫不擋流程) ----------

  smoke-android:
    name: smoke (android emulator)
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kefu-android-debug.apk
          path: pkg
          skip-decompress: true        # APK 本身是 zip 格式,不能讓它被解開

      - name: 啟用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner 的 script 是逐行各自執行,所以先寫成一個完整的 shell 腳本
      - name: 準備冒煙腳本
        run: |
          mkdir -p "$GITHUB_WORKSPACE/smoke"
          cat > "$RUNNER_TEMP/android-smoke.sh" <<'EOF'
          set -uo pipefail
          out="$GITHUB_WORKSPACE/smoke"
          pkg="cc.kf56k.kefu"
          apk="$GITHUB_WORKSPACE/pkg/kefu-android-debug.apk"
          collect() {
            adb logcat -d > "$out/logcat.txt" 2>&1 || true
            adb logcat -d -s chromium:V Capacitor:V Capacitor/Console:V AndroidRuntime:E > "$out/logcat-app.txt" 2>&1 || true
          }
          trap collect EXIT
          ls -la "$GITHUB_WORKSPACE/pkg"
          adb logcat -c || true
          # 快取的模擬器裡可能還留著舊建置(簽章可能不同,覆蓋安裝會失敗、接著測到的是舊版):先移除,
          # 並以 adb install 的結果判斷成功,不能只看套件存在
          adb uninstall "$pkg" > /dev/null 2>&1 || true
          adb install -r -g "$apk" 2>&1 | tee "$out/install.log"
          grep -q '^Success' "$out/install.log" || { echo "安裝失敗(見 install.log)"; exit 1; }
          act=$(adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$pkg" | tr -d '\r' | tail -n 1)
          echo "launcher activity: $act" | tee "$out/start.log"
          if [[ "$act" == */* ]]; then
            adb shell am start -W -n "$act" 2>&1 | tee -a "$out/start.log"
          else
            adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 2>&1 | tee -a "$out/start.log"
          fi
          sleep 25
          adb exec-out screencap -p > "$out/android.png"
          adb shell dumpsys package "$pkg" | grep -E "versionName|versionCode" > "$out/version.txt" || true
          if adb shell pidof "$pkg" > "$out/process.txt"; then
            echo "App 執行中"
          else
            echo "App 行程不存在(可能已閃退)" | tee "$out/process.txt"
            exit 1
          fi
          EOF

      # 快取模擬器系統映像與 AVD:runner 每次重新下載約 1GB 的系統映像,曾遇 Google 下載伺服器回損壞
      # 檔案("Error on ZipFile unknown archive")而無法開機;命中快取時 sdkmanager 視為已安裝、不再下載
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-v1

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash "${{ runner.temp }}/android-smoke.sh"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-android
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

  # ---------- E2E:模擬器上跑 Maestro,伺服器設定 → 登入 → 工作台(暫不擋流程) ----------
  # 帳密來自 secrets E2E_SERVER / E2E_EMAIL / E2E_PASSWORD;沒設定(例如 fork 的 PR)時整個跳過。
  # 流程檔在 e2e/maestro/,說明見 e2e/README.md。

  e2e-android:
    name: e2e (android login)
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      E2E_SERVER: ${{ secrets.E2E_SERVER }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - name: 檢查 E2E secrets
        id: cfg
        shell: bash
        run: |
          if [[ -n "$E2E_EMAIL" && -n "$E2E_PASSWORD" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未設定 E2E_EMAIL / E2E_PASSWORD,跳過 E2E"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ok == 'true'
        with:
          sparse-checkout: e2e

      - uses: actions/download-artifact@v8
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: kefu-android-debug.apk
          path: pkg
          skip-decompress: true

      - uses: actions/setup-java@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝 Maestro
        if: steps.cfg.outputs.ok == 'true'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 啟用 KVM
        if: steps.cfg.outputs.ok == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 準備 E2E 腳本
        if: steps.cfg.outputs.ok == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-out"
          cat > "$RUNNER_TEMP/android-e2e.sh" <<'SH'
          set -uo pipefail
          out="$GITHUB_WORKSPACE/e2e-out"
          pkg="cc.kf56k.kefu"
          apk="$GITHUB_WORKSPACE/pkg/kefu-android-debug.apk"
          collect() {
            # 只收白名單 tag,不收完整 logcat:輸入工具會把打的每個字記下來(Maestro 的字元碼、
            # UiDevice 的「Pressing keycodes」…),逐一封鎖封不完;redact.py 另會刪掉 Maestro 存的完整副本
            adb logcat -d -s ActivityManager:I ActivityTaskManager:I AndroidRuntime:E \
              chromium:V Capacitor:V Capacitor/Console:V > "$out/logcat.txt" 2>&1 || true
            adb logcat -d -s chromium:V Capacitor:V Capacitor/Console:V AndroidRuntime:E > "$out/logcat-app.txt" 2>&1 || true
            adb logcat -d -b crash > "$out/logcat-crash.txt" 2>&1 || true
            cp -R "$HOME/.maestro/tests" "$out/maestro-tests" 2>/dev/null || true
            # wait-setup.yaml 會在畫面空白時重啟 App 讓流程繼續;重啟與 kefu 自己的閃退 / ANR 要看得見。
            # 只算實際執行完成的 launchApp(commands.json 裡巢狀指令是各自一筆,含略過的)
            for f in "$out"/attempt-*/maestro-output/*/*/commands.json; do
              [ -f "$f" ] || continue
              n=$(python3 -c 'import json, sys; print(sum(1 for e in json.load(open(sys.argv[1])) if "launchAppCommand" in e.get("command", {}) and e.get("metadata", {}).get("status") == "COMPLETED"))' "$f" 2>/dev/null || echo 0)
              if [ "$n" -gt 1 ]; then
                echo "::warning title=e2e-android::${f#$out/}:App 被重新啟動 $((n - 1)) 次(wait-setup.yaml)"
              fi
            done
            if grep -q "$pkg" "$out/logcat-crash.txt"; then
              echo "::warning title=e2e-android::kefu 有閃退記錄,見 artifact 的 logcat-crash.txt"
            fi
            if grep -q "ANR in $pkg" "$out/logcat.txt"; then
              echo "::warning title=e2e-android::kefu 發生 ANR,見 artifact 的 logcat.txt"
            fi
          }
          trap collect EXIT
          # 快取的模擬器裡可能還留著舊建置(簽章可能不同,覆蓋安裝會失敗、接著測到的是舊版):先移除,
          # 並以 adb install 的結果判斷成功,不能只看套件存在
          adb uninstall "$pkg" > /dev/null 2>&1 || true
          adb install -r -g "$apk" 2>&1 | tee "$out/install.log"
          grep -q '^Success' "$out/install.log" || { echo "安裝失敗(見 install.log)"; exit 1; }
          maestro --version | tee "$out/maestro-version.txt"
          # 剛開機的模擬器上系統程式(常見是 Pixel Launcher)容易 ANR,「isn't responding」框會蓋住 App
          # (曾兩次重跑都被擋)。關掉系統錯誤對話框:ANR 時系統改為直接重啟該程式,不再跳框
          adb shell settings put global hide_error_dialogs 1 || true
          # 跑 e2e/maestro/login.yaml,失敗最多再跑兩次(模擬器偶發 Device server died、
          # 打字時 driver 逾時之類的基礎設施問題);截圖收在 screenshots/
          E2E_ATTEMPTS=3 E2E_PLATFORM=android bash "$GITHUB_WORKSPACE/e2e/maestro/run.sh" "$out"
          SH

      # 與 smoke 共用模擬器快取,但這裡只還原、不存:登入後的 AVD 資料分割區含 App 的登入 token,
      # 不可存進快取(同 key 的快取可被其他分支 / PR 的 workflow 還原)
      - uses: actions/cache/restore@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google_apis-x86_64-v1

      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.cfg.outputs.ok == 'true'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash "${{ runner.temp }}/android-e2e.sh"

      # 遮蔽沒有成功跑完就不上傳(repo 公開,artifact 任何人都能下載)
      - name: 遮蔽記錄裡的帳密
        id: redact
        if: always() && steps.cfg.outputs.ok == 'true'
        run: python3 e2e/scripts/redact.py e2e-out

      - uses: actions/upload-artifact@v7
        if: always() && steps.redact.outcome == 'success'
        with:
          name: e2e-android
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 7
